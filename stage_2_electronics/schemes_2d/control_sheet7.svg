<text x="38" y="438" font-size="8.5" class="d">Notes on reading this sheet</text>
<text x="40" y="450" font-size="7.5" class="t">- Every terminal arrow names its far end as printed: wire label, then (sheet:column) of the sheet where that conductor is drawn.</text>
<text x="40" y="460" font-size="7.5" class="t">- Copies of this sheet: clean 20261114_014711, 20261114_014751 and 20261114_014834; annotated in red 20261113_193629, photographed again as 20261113_193705. All print &quot;34X10 (6:16)&quot; at +24V.</text>
<text x="40" y="470" font-size="7.5" class="t">- BMR1 is one relay board with plate &quot;BMR2&quot; (photo 20261102_143021); its maker is not printed or seen and its inner circuit is not printed: the box shows terminals only.</text>
<text x="40" y="480" font-size="7.5" class="t">- Y14 (clamp brake): the operating manual (p.40, p.42) says it is released at the top by a BMR output driven by S14 and held by KM6; this set feeds Y14 only from BMR1 25-26 (on-site check).</text>
<text x="40" y="490" font-size="7.5" class="ink">- ink: red Russian notes on the annotated copy (20261113_193629, the same on 20261113_193705), not print: &quot;сигнал на резку A1K2&quot; (signal for cutting) and a tick at IN-0; &quot;Y01 блокир. шестерни&quot; (Y01 gear blocking) at 18X10; &quot;Y14 гидро распр. магнит.&quot; (Y14 hydraulic distributor magnet) at 20X10; &quot;A1 KM1A KM1B&quot; at 14X10; &quot;~24V&quot; at 19 and 20.</text>
<rect x="34" y="426" width="1612" height="74" class="r"/>
<text x="38" y="522" font-size="8.5" class="d">Devices on this sheet (from control_devices.csv; [?] = unclear, estimated = with likely error)</text>
<text x="40" y="534" font-size="7" class="t">UG50 [sure] rectified and AC control supplies +27V +24V +33V ~24V ~48V (PLOŠNÝ SPOJ SE ZDROJI UG50); terminals 1-32; place: cabinet; device row: sheet 3, column 03-04</text>
<text x="40" y="544.8" font-size="7" class="t">X5 [sure] working-earth strip: 0 V of all control supplies, bonded to PE (SVORKOVNICE PRAC. ZEMĚ); terminal numbers not printed; place: cabinet; device row: sheet 2, column 02</text>
<text x="40" y="555.6" font-size="7" class="t">BMR1 [sure] cut-control module: two-hand start, knife lock, clutch contactors, cut-done signal (MODUL ŘÍZENÍ ŘEZU (PŘIPOJENÍ MODULU ŘÍZENÍ ŘEZU BMR1); RU релейный модуль управления</text>
<text x="50" y="564.9" font-size="7" class="t">реза); one relay board, plate &quot;BMR2&quot; (photo 143021), maker not printed or seen; terminals 1-29, 0V (-), +24V (+); OM list 10.2 &quot;BMR..&quot; 900 010 0714; place: cabinet; device row: sheet</text>
<text x="50" y="574.2" font-size="7" class="t">6-7, column 01-18; 01-13</text>
<text x="858" y="534" font-size="7" class="t">PLC [sure] COMPACT PLC: inputs and outputs of sheet 8 (COMPACT PLC); B&amp;R COMPACT P.L.C., 16 inputs / 14 outputs 24 V DC (photo 144328); place: cabinet; device row: sheet 8, column 01-05</text>
<text x="858" y="544.8" font-size="7" class="t">R14 [sure] series resistor of sheet 7 (Y14 supply); 11R/25W; OM 11R-25W; place: cabinet; device row: sheet 7, column 07</text>
<rect x="34" y="510" width="1612" height="79" class="r"/>
<text x="38" y="611" font-size="8.5" class="d">Title block (redrawn, not a copy)</text>
<text x="40" y="623" font-size="7.5" class="t">- Adast Maxima MS 115 PS (serial 578.0009, 1998), control circuits: outputs 19-29 and supply of the cut-control module BMR1.</text>
<text x="40" y="633" font-size="7.5" class="t">- Redrawn from the wiring set 568-70.9001 SCHEMA ZAPOJENÍ (MS 80 PS,DS MS 115 PS,DS), sheet 7; columns and zones as printed.</text>
<text x="40" y="643" font-size="7.5" class="t">- Sheet photo: preparatory_data_analysis/maxima_documents/adast_guillotine_wiring_and_plc_diagrams/20261114_014711.jpg</text>
<text x="40" y="653" font-size="7.5" class="t">- Data: stage_2_electronics/netlist/control_devices.csv and control_wires.csv, drawn by stage_2_electronics/schemes_2d/control_draw.py.</text>
<text x="40" y="663" font-size="7.5" class="t">- Marks: dashed line or [?] = unclear (on-site check list, spec/control.md); contacts in the off state as printed; end names 1/2 of lamps, RC parts and diodes are this redraw's names (1 = feed end, 2 = return end).</text>
